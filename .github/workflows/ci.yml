name: Verify product and model
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: pip install -r requirements.txt
      - name: Replay fixed retained edition without network
        run: python scripts/replay_retained_fixture.py
      - name: Replay immutable input archive without network
        run: python scripts/replay_input_archive.py b662fbbc53d786bb1994a1a51838943a2a6426226654363f46356acd10cb27ff
      - run: python scripts/prepare_test_data.py
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install browser verification runtime
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium webkit
      - name: Verify market deadlines in Chromium and WebKit
        id: market-clocks
        run: python scripts/check_market_clock.py
      - name: Retain successful browser deadline evidence
        if: ${{ !cancelled() && steps.market-clocks.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: market-deadlines-${{ github.run_id }}-${{ github.run_attempt }}
          path: reviews/market-clock-fixture-browser.json
          if-no-files-found: error
          retention-days: 30
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
