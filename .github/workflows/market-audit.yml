name: Audit market checkpoint coverage
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Collect and verify odds"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: market-checkpoint-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_market*.py'
      - run: python scripts/run_market_audit.py
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      - name: Retain public-safe storage receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: market-audit-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: release-recovery/market-audit-retention.json
          if-no-files-found: error
