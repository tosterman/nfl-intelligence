name: Collect and verify odds
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,6,11,16,21 * * *'
permissions:
  contents: read
concurrency:
  group: odds-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/collect_odds.ts
        env:
          ODDS_COLLECTION_SECRET: ${{ secrets.ODDS_COLLECTION_SECRET }}
