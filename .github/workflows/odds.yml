name: Collect and verify odds
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,6,11,16,21 * * *'
permissions:
  contents: read
concurrency:
  group: odds-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/collect_odds.ts
        env:
          ODDS_COLLECTION_SECRET: ${{ secrets.ODDS_COLLECTION_SECRET }}
      - name: Retain collection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: odds-collection-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          path: release-recovery/odds-collection-report.json
          if-no-files-found: error
