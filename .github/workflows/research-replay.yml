name: Reproduce frozen joint-score audits
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    # Frozen priors were generated with the Windows NumPy wheel. Linux BLAS
    # produces different low-order covariance bits; never relax their hashes.
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_joint_replay.py'
      - run: python scripts/replay_joint_audits.py
