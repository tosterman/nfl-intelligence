name: Refresh and publish forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'
permissions:
  contents: write
  statuses: read
concurrency:
  group: forecast-publication
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm run data:refresh
      - name: Verify retained forecast input bytes
        run: python scripts/verify_forecast_inputs.py
      - name: Numerically replay newly generated forecasts
        run: python scripts/replay_forecast.py --new-snapshots > release-recovery/numerical-replay.json
      - run: python scripts/refresh_weather.py
      - name: Collect listed quarterback roles
        continue-on-error: true
        run: python scripts/refresh_quarterbacks.py
      - name: Collect personnel context independently of core forecasts
        continue-on-error: true
        run: python scripts/refresh_personnel.py
      - name: Rebuild verified personnel comparison
        continue-on-error: true
        run: python scripts/personnel_changes.py
      - name: Rebuild identity-verified historical participation
        continue-on-error: true
        run: |
          python scripts/audit_personnel_identity.py
          python scripts/audit_player_usage.py
          python scripts/build_public_usage.py
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
      - name: Configure archive author
        run: |
          git config user.name 'NFL Intelligence publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish through Git and verify public capture
        run: python scripts/git_publication.py
      - name: Retain publication recovery evidence even if deployment fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            data/site.json
            data/ledger.json
            data/source.json
            data/games.csv
            data/raw/stats_team_week_*.csv
            data/publications.json
            data/weather.json
            data/weather-ledger.json
            data/weather-sources/
            data/personnel-changes.json
            data/player-usage.json
            reviews/personnel-identity-audit.json
            reviews/player-usage-audit.json
            data/personnel.json
            data/quarterbacks.json
            data/quarterback-collection.json
            data/quarterback-sources/
            data/personnel-collection.json
            data/personnel-sources/
            release-recovery/deployment.json
            release-recovery/git-publication.json
            release-recovery/forecast-inputs.json
            release-recovery/numerical-replay.json
      - name: Commit forecast archive and publication receipt
        run: |
          git config user.name 'NFL Intelligence publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/player-usage.json data/personnel-changes.json data/quarterbacks.json data/quarterback-collection.json data/quarterback-sources/ data/site.json data/ledger.json data/source.json data/publications.json data/weather.json data/weather-ledger.json data/weather-sources/ data/personnel.json data/personnel-collection.json data/personnel-sources/
          git diff --cached --quiet && exit 0
          git commit -m 'data: archive verified forecast publication'
          python scripts/push_publication.py
