name: Refresh and publish forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'
permissions:
  contents: write
concurrency:
  group: forecast-publication
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Require publishing credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo 'Publishing secrets are not configured. Existing public forecasts remain unchanged.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm run data:refresh
      - run: python scripts/refresh_weather.py
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
      - name: Deploy and verify publication
        run: python scripts/deploy_release.py
      - name: Retain publication recovery evidence even if deployment fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            data/site.json
            data/ledger.json
            data/source.json
            data/publications.json
            data/weather.json
            data/weather-ledger.json
            data/weather-sources/
            release-recovery/deployment.json
      - name: Commit forecast archive and publication receipt
        run: |
          git config user.name 'NFL Intelligence publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/site.json data/ledger.json data/source.json data/publications.json data/weather.json data/weather-ledger.json data/weather-sources/
          git diff --cached --quiet && exit 0
          git commit -m 'data: archive verified forecast publication'
          python scripts/push_publication.py
